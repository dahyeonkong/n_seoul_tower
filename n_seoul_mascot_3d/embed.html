<!doctype html>
<html lang="ko" data-default-motion="walk" data-travel="false" data-show-ground="false">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="걷는 N서울타워 3D 마스코트">
    <title>N서울타워 걷는 마스코트</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js"
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      .mascot_embed,
      .mascot_canvas_wrap,
      [data-mascot-canvas] {
        width: 100%;
        height: 100%;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .mascot_embed,
      .mascot_canvas_wrap {
        position: relative;
      }

      [data-mascot-canvas] {
        display: block;
        cursor: grab;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      [data-mascot-canvas]:active {
        cursor: grabbing;
      }

      [data-mascot-canvas]:focus-visible {
        outline: 3px solid #223147;
        outline-offset: -3px;
      }

      .embed_message {
        position: absolute;
        inset: 50% auto auto 50%;
        margin: 0;
        transform: translate(-50%, -50%);
        color: #223147;
        font: 14px/1.5 Arial, "Noto Sans KR", sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="mascot_embed">
      <div class="mascot_canvas_wrap" data-canvas-wrap>
        <canvas
          data-mascot-canvas
          aria-label="제자리에서 걷는 N서울타워 3D 마스코트. 좌우로 드래그해 돌려볼 수 있습니다."
        ></canvas>
        <p class="embed_message" data-loading-message role="status">3D 마스코트를 불러오는 중입니다.</p>
        <p class="embed_message" data-error-message role="alert" hidden></p>
      </div>
    </main>

    <script type="module" src="./mascot.js"></script>
  </body>
</html>
