<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Stack 3D — 중간 섹션 데모</title>
<link rel="stylesheet" href="./scroll-stack-3d.css">
<style>
  /* 아래는 데모 페이지용 스타일. 실제 프로젝트에서는 필요 없다. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #faf9f5;
    color: #2f3328;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
      "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .band {
    min-height: 90vh;
    display: grid;
    align-content: center;
    gap: 18px;
    padding: 12vh clamp(24px, 6vw, 96px);
    max-width: 900px;
  }
  .band h1 { margin: 0; font-size: clamp(34px, 6vw, 68px); line-height: 1.1; letter-spacing: -0.02em; }
  .band h2 { margin: 0; font-size: clamp(24px, 4vw, 40px); line-height: 1.2; letter-spacing: -0.01em; }
  .band p { margin: 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.75; color: #5d6152; max-width: 56ch; }
  .tag { font-size: 11px; letter-spacing: 0.22em; font-weight: 600; color: #9aa08c; }
</style>
</head>
<body>

<!-- ── 앞 섹션 (호스트 페이지의 기존 콘텐츠) ───────────────────── -->
<section class="band">
  <p class="tag">SECTION 01</p>
  <h1>여기는 3D 섹션<br>앞에 오는 콘텐츠입니다.</h1>
  <p>
    이 모듈은 페이지 전체를 차지하지 않습니다. 앞뒤로 어떤 섹션이 와도 상관없고,
    스크롤이 이 아래 섹션에 닿는 순간에만 3D 씬이 살아납니다.
  </p>
</section>

<!-- ── 중간 섹션 (드롭인 대상) ─────────────────────────────────
     실제 프로젝트에는 이 한 줄만 넣으면 됩니다. -->
<section id="stack" class="s3d"></section>

<!-- ── 뒤 섹션 ─────────────────────────────────────────────── -->
<section class="band">
  <p class="tag">SECTION 03</p>
  <h2>스크롤이 지나가면 렌더 루프가 멈춥니다.</h2>
  <p>
    섹션이 뷰포트를 벗어나면 <code>gsap.ticker</code> 콜백이 즉시 반환하므로,
    페이지 나머지를 읽는 동안 GPU를 소모하지 않습니다.
  </p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="./scroll-stack-3d.js"></script>
<script>
  ScrollStack3D.init({
    mount: '#stack',
    scrollLength: '620%',
    scrub: 0.8,
    eyebrow: 'HOW IT STACKS'
  });
</script>
</body>
</html>
